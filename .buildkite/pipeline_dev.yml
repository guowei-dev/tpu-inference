# pipeline_dev.yml — branch-scoped fan-out for the XLA OFAT autotune sweep.
#
# This file replaces the dev-pipeline demo steps for this branch only.
# Each matrix entry below is one VM; the matrix length defines the shard
# count.  Edit the matrix to add/remove shards.
#
# Configuration the autotune run reads:
#   .buildkite/xla_autotune/flags.txt        candidate XLA flags (one per line)
#   .buildkite/xla_autotune/config.json      vllm serve + benchmark overrides
#   .buildkite/xla_autotune/autotuner.py     OFAT driver
#   .buildkite/xla_autotune/vllm_test_framework.py
#
# First-startup mitigation notes
# ──────────────────────────────
# The 397B model precompile is ~90 min cold-cache because every shard
# sweeps ~36 backbone shapes (token_buckets × num_reqs).  Mitigations
# wired up today:
#   * Persistent JAX cache (run_in_docker.sh pulls from GCS at start and
#     pushes back on exit) — gives warm-cache hits for baselines once a
#     prior build has populated GCS.
#   * Persistent model-weights cache at /mnt/disks/persist/models — weights
#     load only once per agent VM lifetime.
#   * Per-shard within-trial cache reuse — baseline_02/03 reuse the
#     baseline_01 cache and finish in ~10 min instead of ~100 min.
# Not mitigable: each *candidate* trial uses a unique extra XLA flag, so
# its JAX cache key never hits a pre-warmed entry — candidate compile is
# always cold (~90 min).
#
# Trigger via API (fork branch — full 40-char SHA, branch namespacing):
#   curl -s -X POST -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{
#       \"commit\": \"<full-40-char-sha>\",
#       \"branch\": \"guowei-dev:<branch-name>\",
#       \"message\": \"xla autotune\",
#       \"ignore_pipeline_branch_filters\": true
#     }"

steps:

  # -----------------------------------------------------------------
  # Build Step (required by all autotune shards)
  # -----------------------------------------------------------------
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  # -----------------------------------------------------------------
  # XLA OFAT autotune fan-out
  # -----------------------------------------------------------------
  # Each matrix entry runs the shard script with positional args
  #   <slice_index> <slice_count>
  # Slice math (handled by autotuner.py / slice_flags()):
  #   chunk = ceil(len(flags) / slice_count)
  #   shard K (1-based) processes flags[(K-1)*chunk : K*chunk]
  # For the staged flags.txt (10 flags) with matrix=4:
  #   shard 1 → flags 1-3, shard 2 → flags 4-6, shard 3 → flags 7-9,
  #   shard 4 → flag 10.  Every shard additionally runs 3 baselines.
  - label: "tpu7x [xla-autotune-smoke] shard 1/1"
    key: tpu7x_xla_autotune_smoke
    depends_on: tpu7x_build_docker
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "vllm"
      NEW_MODEL_DESIGN: "1"
      AUTOTUNE_MODEL: "Qwen/Qwen3.5-397B-A17B-FP8"
      AUTOTUNE_TARGET_METRIC: "total_token_throughput"
      AUTOTUNE_BASELINE_RUNS: "1"
      # Smoke mode: point the autotuner at the smoke flag list + minimal
      # benchmark config. Each trial then completes in ~10-15 min instead
      # of ~110 min, so we can validate the cache-hit fix BEFORE committing
      # to the full multi-hour sweep.
      AUTOTUNE_FLAGS: ".buildkite/xla_autotune/flags.smoke.txt"
      AUTOTUNE_CONFIG: ".buildkite/xla_autotune/config.smoke.json"
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - .buildkite/scripts/run_xla_autotune_shard.sh 1 1
